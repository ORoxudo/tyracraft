name: Build TyraCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra

    steps:
      - uses: actions/checkout@v4

      - name: Inspect image
        run: |
          {
            echo "tyra dir:"; ls -la /tyra | head -30
            echo "engine git:"; git -C /tyra log -1 --format='%H %cd %s' 2>&1 || true
            echo "engine bin:"; ls /tyra/engine/bin 2>&1 || true
          } | tee inspect.log
          sed 's/^/::notice::/' inspect.log | head -40

      # This code (master, Aug 2024) was written against the Tyra engine of
      # that time. Pin the engine inside the image to its last commit before
      # 2024-08-17 so newer engine API changes don't break the build.
      - name: Pin Tyra engine version
        run: |
          if [ -d /tyra/.git ]; then
            cd /tyra
            git config --global --add safe.directory /tyra
            git fetch --quiet --unshallow origin 2>/dev/null || git fetch --quiet origin || true
            REF=$(git rev-list -1 --before=2024-08-17 origin/HEAD 2>/dev/null || git rev-list -1 --before=2024-08-17 HEAD)
            echo "::notice::Pinning engine to $REF"
            git checkout --quiet "$REF"
          else
            echo "::notice::/tyra is not a git repo, using the bundled engine"
          fi

      - name: Build engine
        shell: bash
        run: |
          set -o pipefail
          make build-engine -j"$(nproc)" 2>&1 | tee engine.log || {
            grep -iE 'error|undefined|no such' engine.log | head -25 | sed 's/^/::error::/'
            tail -15 engine.log | sed 's/^/::error::/'
            exit 1
          }

      - name: Build game
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee game.log || {
            grep -iE 'error|undefined|no such' game.log | head -25 | sed 's/^/::error::/'
            tail -15 game.log | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: tyracraft-elf
          path: bin/*.elf
          if-no-files-found: error
