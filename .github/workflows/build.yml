name: Build TyraCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra

    steps:
      - uses: actions/checkout@v4

      # The image only ships the PS2 toolchain. The Makefile expects the Tyra
      # engine at /tyra. This game code (master, Aug 2024) matches the last
      # engine commit before that date (Feb 2024), so pin it.
      - name: Get Tyra engine
        uses: actions/checkout@v4
        with:
          repository: h4570/tyra
          ref: 1e396fb1a319f5f11832a4e05813cd895e0eb336
          path: .tyra

      - name: Link engine to /tyra
        run: ln -sfn "$GITHUB_WORKSPACE/.tyra" /tyra

      - name: Build engine
        shell: bash
        run: |
          set -o pipefail
          make build-engine -j"$(nproc)" 2>&1 | tee engine.log || {
            grep -iE 'error|undefined|no such' engine.log | head -25 | sed 's/^/::error::/'
            tail -15 engine.log | sed 's/^/::error::/'
            exit 1
          }

      - name: Build game
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee game.log || {
            grep -iE 'error|undefined|no such' game.log | head -25 | sed 's/^/::error::/'
            tail -15 game.log | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: tyracraft-elf
          path: bin/*.elf
          if-no-files-found: error
